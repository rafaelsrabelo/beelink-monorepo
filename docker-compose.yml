services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports:
      - "5432:5432"
    # Postgres 18 images keep data under a versioned subfolder of this path, not /data.
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every e-mail the API sends in development and in tests — nothing leaves the machine.
  # SMTP on 1025; the inbox and its REST API on http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.31.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
